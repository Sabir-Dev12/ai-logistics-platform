# Local SQL Server + API. Set MSSQL_SA_PASSWORD and AUTH_SIGNING_KEY before starting.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: logistics-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your environment}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # sqlcmd ships with the SQL Server 2022 image at this path.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: src/Logistics.Api/Dockerfile
    container_name: logistics-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__LogisticsDatabase: "Server=sqlserver,1433;Database=LogisticsDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Tenant__SocieteKey: "S01"
      Tenant__UserDisplayName: "SYSTEM"

      # Supplied explicitly rather than relying on the development key that ships inside the image.
      # Override with AUTH_SIGNING_KEY in the environment; the fallback is a throwaway local value.
      Authentication__SigningKey: "${AUTH_SIGNING_KEY:?Set AUTH_SIGNING_KEY}"

      # The authenticated path is the default here. See the header comment to opt out locally.
      Authentication__AllowHeaderFallback: "false"

      # Service account for POST /api/v1/auth/token (see appsettings.Development.json).
      Authentication__ServiceAccount__Identifiant: "${AUTH_SERVICE_USER:-}"
      Authentication__ServiceAccount__MotDePasse: "${AUTH_SERVICE_PASSWORD:-}"
    ports:
      - "8080:8080"

volumes:
  sqlserver-data:
